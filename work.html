<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naman Modani</title>
    <!-- Import Inter fonts -->
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <link rel = "icon" type= "image/png" href = "old/images/favicon.png" async> 
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Styles */
        body {
            font-family: 'Inter', sans-serif;
            font-size: 15.5px;
            line-height: 1.4; /* Adjusted line height */
            color: #2B2B2B;
            margin: 0;
            padding: 0;
        }
    
        .container {
            max-width: 450px;
            margin: 0 auto;
            padding: 20px;
            margin-left: 5.5%; /* Add left margin to move content to the left */
            margin-top: 5.5%;
        }
    
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500; /* Set font weight for navbar links */
            margin-bottom: 20px; /* Add margin bottom to create separation from content */
        }
    
        .navbar a {
            color: #bfbfbf; /* Set default color for non-active links */
            text-decoration: none;
            transition: color 0.3s;
            margin-right: 20px;
            font-weight: 500; /* Set default font weight for navbar links */
        }
    
        .navbar a:hover {
            color: #333;
        }
    
        .navbar a.active {
            color: #000; /* Set color for selected item */
        }
    
        /* Set font weight and style for paragraphs */
        p {
            font-family: 'Inter', sans-serif;
            font-weight: 350; /* Set regular font weight */
            color: #2B2B2B;
            margin-bottom: 10px; /* Added margin bottom for better separation between paragraphs */
        }
    
        /* Additional Styles */
        a {
            color: black; /* Set default color for links to black */
            text-decoration: none;
        }
    
        a:hover {
            color: #333; /* Change color on hover */
        }
    
        a[href^="https://www.linkedin.com"], a[href^="https://www.github.com"], a[href^="mailto:"] {
            text-decoration: underline; /* Underline LinkedIn, GitHub, and email links */
        }

        .source-link {
            color: #808080; /* Set color to gray */
            font-size: 15px; /* Set font size to slightly smaller */
        }


        .source-link + i {
            font-size: smaller; /* Reduce arrow size */
            color: #b2b2b2; /* Change arrow color to #b2b2b2 */
        }

        /* Media query for phones */
        @media only screen and (max-width: 600px) {
            .container {
                width: 80%; /* Set width to 80% */
                margin: 0 auto; /* Center the container */
                padding: 10px; /* Adjust padding for smaller screens */
                margin-top: 5%;
            }

            body {
                font-family: 'Inter', sans-serif;
                font-size: 15px;
                line-height: 1.4; /* Adjusted line height */
                color: #2B2B2B;
                margin: 0;
                padding: 0;
        }
        }

        /* Media query for monitors and big screens */
        @media only screen and (min-width: 1600px) {
            .container {
                max-width: 600px;
            }
        }
    </style>    
</head>

<body>
    <div class="container">
        <div class="navbar">
            <div>
                <a href="./index.html" id="homeLink">Naman Modani</a>
                <a href="./work.html" id="workLink" class="active">Work</a>
                <a href="./blog.html" id="blogLink">Blog</a> 
            </div>
        </div>

        <div class="work-content">
            <p><a href="https://careers.linkedin.com/apm" class="source-link" rel="noopener" target="_blank">LinkedIn</a> <i class="fa-solid fa-square-arrow-up-right"></i><br>
            Associate Product Manager</p>

            <p><a href="https://slack.engineering/unleashing-impact-at-slacks-data-engineering-internship/" class="source-link" rel="noopener" target="_blank">Slack</a> <i class="fa-solid fa-square-arrow-up-right"></i><br>
            Technical Program Manager</p>

            <p><a href="https://www.ericsson.com/en/careers/student-young-professionals/internships" class="source-link" rel="noopener" target="_blank">Ericsson</a> <i class="fa-solid fa-square-arrow-up-right"></i><br>
            Software Engineer</p>

            <p><a href="https://codein.withgoogle.com/archive/2019/" class="source-link" rel="noopener" target="_blank">Copyleft Games</a> <i class="fa-solid fa-square-arrow-up-right"></i><br>
            Open Source Developer</p>

            <p><a href="https://namanmodani.github.io/old/pdfs/srs.pdf" class="source-link" rel="noopener" target="_blank">Stanford University</a> <i class="fa-solid fa-square-arrow-up-right"></i><br>
            Student Researcher</p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var navbarLinks = document.querySelectorAll('.navbar a');

            navbarLinks.forEach(function(link) {
                link.addEventListener('click', function() {
                    navbarLinks.forEach(function(navLink) {
                        navLink.classList.remove('active');
                    });

                    link.classList.add('active');
                });
            });
        });
    </script>
</body>

</html>
